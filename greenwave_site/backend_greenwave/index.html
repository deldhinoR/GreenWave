<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Traffic Map Project</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <style>
        :root {
            --panel-bg: rgba(247, 244, 237, 0.95);
            --panel-border: #c8bba9;
            --accent: #bc2c1a;
            --text: #1f1f1f;
            --shadow: 0 18px 40px rgba(58, 39, 17, 0.16);
        }

        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            color: var(--text);
        }

        #map {
            height: 100vh;
        }

        .panel {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 1000;
            width: min(280px, calc(100vw - 32px));
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            padding: 16px;
            backdrop-filter: blur(8px);
        }

        .panel h1 {
            margin: 0 0 8px;
            font-size: 24px;
        }

        .panel p {
            margin: 0 0 12px;
            line-height: 1.4;
        }

        #status {
            font-size: 14px;
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(188, 44, 26, 0.08);
        }

        #status[data-error="true"] {
            color: #8f170b;
            background: rgba(188, 44, 26, 0.15);
        }

        .panel-actions {
            margin-top: 12px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        #simulate-btn,
        #cancel-btn {
            width: 100%;
            border: 0;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        #simulate-btn {
            background: var(--accent);
            color: white;
        }

        #cancel-btn {
            background: #ece4da;
            color: #5a4631;
        }

        #simulate-btn:disabled {
            background: #b7aca3;
            cursor: not-allowed;
        }

        #cancel-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="panel">
        <h1>Area Selection</h1>
        <p>The paths within the selected area are manipulated using the selection button.</p>
        <div id="status" data-error="false">Please select the area you wish to edit.</div>
        <div class="panel-actions">
            <button id="cancel-btn" disabled>Cancel</button>
            <button id="simulate-btn">Edit</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script src="script.js"></script>
</body>
</html>
